<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サバゲー部 リアルタイムランキング</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid font-bold text-amber-500 text-xl fa-trophy"></i>
        <h1 class="font-black text-lg tracking-wider text-slate-100">サバゲー部 順位表</h1>
      </div>
      <span id="total-players-count" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full border border-slate-600">参加者: 0名</span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 space-y-4">
    <div class="flex justify-between items-center px-1">
      <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider"><i class="fa-solid fa-ranking-star mr-1"></i>現在のスコア</h2>
      <span class="text-[11px] text-slate-400">※リアルタイム更新</span>
    </div>

    <!-- Ranking Cards List -->
    <div id="ranking-list" class="space-y-2.5">
      <!-- Injected via JS -->
    </div>
  </main>

  <script>
    function render() {
      // Fetch latest players & teams data from shared storage
      const players = JSON.parse(localStorage.getItem('sabage_players_v6')) || [];
      const teams = JSON.parse(localStorage.getItem('sabage_teams_v6')) || [];

      document.getElementById('total-players-count').textContent = `参加者: ${players.length}名`;
      const rankingList = document.getElementById('ranking-list');
      rankingList.innerHTML = '';

      if (players.length === 0) {
        rankingList.innerHTML = '<div class="text-center text-slate-500 py-12 text-sm bg-slate-800 rounded-xl border border-slate-700">現在集計データはありません</div>';
        return;
      }

      const sorted = [...players].sort((a, b) => b.points - a.points);
      sorted.forEach((p, idx) => {
        // XSS対策：DOMを安全に構築
        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700 rounded-xl p-3.5 flex items-center justify-between shadow-sm";

        const leftDiv = document.createElement('div');
        leftDiv.className = "flex items-center space-x-3";

        // 順位バッジ
        const rankBadge = document.createElement('span');
        if (idx === 0) {
          rankBadge.className = "w-7 h-7 rounded-full bg-amber-400 text-slate-950 font-black text-sm flex items-center justify-center shadow-lg";
          rankBadge.innerHTML = `<i class="fa-solid fa-crown text-xs mr-0.5"></i>1`;
        } else if (idx === 1) {
          rankBadge.className = "w-7 h-7 rounded-full bg-slate-300 text-slate-950 font-black text-xs flex items-center justify-center shadow";
          rankBadge.textContent = "2";
        } else if (idx === 2) {
          rankBadge.className = "w-7 h-7 rounded-full bg-amber-700 text-amber-100 font-black text-xs flex items-center justify-center shadow";
          rankBadge.textContent = "3";
        } else {
          rankBadge.className = "w-7 h-7 rounded-full bg-slate-700 text-slate-300 font-bold text-xs flex items-center justify-center";
          rankBadge.textContent = idx + 1;
        }
        leftDiv.appendChild(rankBadge);

        // プレイヤー名（textContentを使用し安全にエスケープ）
        const nameSpan = document.createElement('span');
        nameSpan.className = "font-bold text-base text-slate-100";
        nameSpan.textContent = p.name;
        leftDiv.appendChild(nameSpan);

        // チーム名
        const team = teams.find(t => t.id === p.teamId);
        if (team) {
          const teamLabel = document.createElement('span');
          teamLabel.className = "text-[10px] bg-slate-700 border border-slate-600 px-2 py-0.5 rounded-full text-slate-300 ml-2";
          teamLabel.textContent = team.name;
          leftDiv.appendChild(teamLabel);
        }

        card.appendChild(leftDiv);

        // ポイント表示
        const rightDiv = document.createElement('div');
        rightDiv.className = "font-black text-lg text-amber-400";
        rightDiv.textContent = p.points + " ";

        const ptSpan = document.createElement('span');
        ptSpan.className = "text-xs font-normal text-slate-400";
        ptSpan.textContent = "pt";
        rightDiv.appendChild(ptSpan);

        card.appendChild(rightDiv);
        rankingList.appendChild(card);
      });
    }

    // Auto Refresh every 3 seconds to keep ranking up to date
    setInterval(render, 3000);
    window.addEventListener('storage', render);
    render();
  </script>

  <script type="module">
    // Import the functions you need from the SDKs you need (バージョンを安定版の 10.8.0 に修正)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD-9HM6DAcSHZvx6_zcdRk-Q7j9W5PnUJs",
      authDomain: "cac-pointapp.firebaseapp.com",
      projectId: "cac-pointapp",
      storageBucket: "cac-pointapp.firebasestorage.app",
      messagingSenderId: "428732442449",
      appId: "1:428732442449:web:ea6bbbf5693736d8a89570",
      measurementId: "G-4XXCRZT4VZ"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>
</body>
</html>
