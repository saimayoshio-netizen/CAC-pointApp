<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAC リアルタイムランキング</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid font-bold text-amber-500 text-xl fa-trophy"></i>
        <h1 class="font-black text-lg tracking-wider text-slate-100">CAC 順位表</h1>
      </div>
      <span id="total-players-count" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full border border-slate-600">参加者: 0名</span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 space-y-4">
    
    <!-- Public Tab Navigation (Ranking / Teams) -->
    <div class="grid grid-cols-2 gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700 text-xs font-bold text-center">
      <button id="pub-tab-ranking" onclick="switchPubTab('ranking')" class="py-2.5 rounded-md bg-amber-500 text-slate-950 shadow transition">
        <i class="fa-solid fa-trophy mr-1"></i>個人ランキング
      </button>
      <button id="pub-tab-teams" onclick="switchPubTab('teams')" class="py-2.5 rounded-md text-slate-400 hover:text-slate-200 transition">
        <i class="fa-solid fa-users mr-1"></i>チーム別一覧
      </button>
    </div>

    <!-- TAB 1: RANKING -->
    <section id="pub-sec-ranking" class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider"><i class="fa-solid fa-ranking-star mr-1"></i>現在のスコア</h2>
        <span class="text-[11px] text-slate-400">※リアルタイム更新</span>
      </div>

      <!-- Ranking Cards List -->
      <div id="ranking-list" class="space-y-2.5">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- TAB 2: TEAMS LIST -->
    <section id="pub-sec-teams" class="hidden space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider"><i class="fa-solid fa-users-rectangle mr-1"></i>チーム別メンバー・合計</h2>
        <span class="text-[11px] text-slate-400">※リアルタイム更新</span>
      </div>

      <!-- Teams Cards List -->
      <div id="teams-public-list" class="space-y-3">
        <!-- Injected via JS -->
      </div>
    </section>

  </main>

  <!-- Firebase SDK & Firestore Realtime Sync -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD-9HM6DAcSHZvx6_zcdRk-Q7j9W5PnUJs",
      authDomain: "cac-pointapp.firebaseapp.com",
      projectId: "cac-pointapp",
      storageBucket: "cac-pointapp.firebasestorage.app",
      messagingSenderId: "428732442449",
      appId: "1:428732442449:web:ea6bbbf5693736d8a89570",
      measurementId: "G-4XXCRZT4VZ"
    };

    // Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // グローバルデータ保持用
    let currentPlayers = [];
    let currentTeams = [];

    // 公開画面のタブ切り替え
    window.switchPubTab = function(tab) {
      ['ranking', 'teams'].forEach(t => {
        document.getElementById(`pub-sec-${t}`).classList.add('hidden');
        document.getElementById(`pub-tab-${t}`).className = "py-2.5 rounded-md text-slate-400 hover:text-slate-200 transition";
      });

      document.getElementById(`pub-sec-${tab}`).classList.remove('hidden');
      document.getElementById(`pub-tab-${tab}`).className = "py-2.5 rounded-md bg-amber-500 text-slate-950 shadow transition font-bold";
    };

    function getTeamBadgeClass(color) {
      switch(color) {
        case 'red': return 'bg-rose-500/20 text-rose-300 border-rose-500/40';
        case 'yellow': return 'bg-amber-500/20 text-amber-300 border-amber-500/40';
        case 'emerald': return 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
        case 'blue': return 'bg-blue-500/20 text-blue-300 border-blue-500/40';
        case 'purple': return 'bg-purple-500/20 text-purple-300 border-purple-500/40';
        case 'none':
        default: return 'bg-slate-700 text-slate-300 border-slate-600';
      }
    }

    function render(players, teams) {
      currentPlayers = players;
      currentTeams = teams;

      const activePlayers = players.filter(p => p.active !== false);
      document.getElementById('total-players-count').textContent = `参加者: ${activePlayers.length}名`;

      const rankingList = document.getElementById('ranking-list');
      rankingList.innerHTML = '';

      if (players.length === 0) {
        rankingList.innerHTML = '<div class="text-center text-slate-500 py-12 text-sm bg-slate-800 rounded-xl border border-slate-700">現在集計データはありません</div>';
      } else {
        const sorted = [...players].sort((a, b) => b.points - a.points);
        let currentRank = 1;

        sorted.forEach((p, idx) => {
          if (idx > 0 && p.points < sorted[idx - 1].points) {
            currentRank = idx + 1;
          }

          let rankBadge = `<span class="w-7 h-7 rounded-full bg-slate-700 text-slate-300 font-bold text-xs flex items-center justify-center">${currentRank}</span>`;
          if (currentRank === 1) rankBadge = `<span class="w-7 h-7 rounded-full bg-amber-400 text-slate-950 font-black text-sm flex items-center justify-center shadow-lg"><i class="fa-solid fa-crown text-xs mr-0.5"></i>1</span>`;
          if (currentRank === 2) rankBadge = `<span class="w-7 h-7 rounded-full bg-slate-300 text-slate-950 font-black text-xs flex items-center justify-center shadow">2</span>`;
          if (currentRank === 3) rankBadge = `<span class="w-7 h-7 rounded-full bg-amber-700 text-amber-100 font-black text-xs flex items-center justify-center shadow">3</span>`;

          const team = teams.find(t => t.id === p.teamId);
          const badgeClass = team ? getTeamBadgeClass(team.color) : 'bg-slate-700 text-slate-300 border-slate-600';
          const teamLabel = team ? `<span class="text-[10px] border px-2 py-0.5 rounded-full ${badgeClass} ml-2 font-bold">${escapeHtml(team.name)}</span>` : '';

          const card = document.createElement('div');
          card.className = "bg-slate-800 border border-slate-700 rounded-xl p-3.5 flex items-center justify-between shadow-sm";
          card.innerHTML = `
            <div class="flex items-center space-x-3">
              ${rankBadge}
              <span class="font-bold text-base text-slate-100">${escapeHtml(p.name)}</span>
              ${teamLabel}
            </div>
            <div class="font-black text-lg text-amber-400">
              ${p.points} <span class="text-xs font-normal text-slate-400">pt</span>
            </div>
          `;
          rankingList.appendChild(card);
        });
      }

      // 2. チーム別一覧描画
      const teamsPublicList = document.getElementById('teams-public-list');
      teamsPublicList.innerHTML = '';

      if (teams.length === 0) {
        teamsPublicList.innerHTML = '<div class="text-center text-slate-500 py-12 text-sm bg-slate-800 rounded-xl border border-slate-700">チームが登録されていません</div>';
      } else {
        teams.forEach(t => {
          const teamMembers = players.filter(p => p.teamId === t.id);
          const totalTeamPoints = teamMembers.reduce((sum, m) => sum + (m.points || 0), 0);
          const badgeClass = getTeamBadgeClass(t.color);

          const teamCard = document.createElement('div');
          teamCard.className = "bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3 shadow-sm";
          
          let membersHTML = teamMembers.map(m => `
            <div class="flex justify-between items-center bg-slate-900 px-3 py-2 rounded-lg border border-slate-800 text-xs">
              <span class="font-bold text-slate-200">${escapeHtml(m.name)}</span>
              <span class="font-black text-amber-400">${m.points} <span class="text-[10px] font-normal text-slate-400">pt</span></span>
            </div>
          `).join('');

          if(teamMembers.length === 0) {
            membersHTML = '<div class="text-slate-500 text-xs italic text-center py-2">所属メンバーなし</div>';
          }

          teamCard.innerHTML = `
            <div class="flex justify-between items-center border-b border-slate-700 pb-2.5">
              <span class="font-extrabold text-sm px-3 py-1 rounded-full border ${badgeClass}"><i class="fa-solid fa-users text-xs mr-1.5"></i>${escapeHtml(t.name)}</span>
              <span class="font-black text-emerald-400 text-sm">チーム合計: ${totalTeamPoints} pt</span>
            </div>
            <div class="space-y-1.5">${membersHTML}</div>
          `;
          teamsPublicList.appendChild(teamCard);
        });
      }
    }

    // HTMLエスケープ処理
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Firestoreのデータをリアルタイム監視
    onSnapshot(doc(db, "sabage", "mainData"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        const players = data.players || [];
        const teams = data.teams || [];
        render(players, teams);
      } else {
        render([], []);
      }
    }, (error) => {
      console.error("同期エラー:", error);
    });
  </script>
</body>
</html>
